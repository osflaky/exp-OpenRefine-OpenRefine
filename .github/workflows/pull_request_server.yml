name: server CI

on:
  workflow_dispatch:
permissions: read-all

jobs:
  linux_server_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 25
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}

    # Service containers only work on Linux runners, so the databases are
    # installed natively on every OS instead. Bash keeps the steps portable.
    defaults:
      run:
        shell: bash

    steps:
    - name: Set up secrets
      run: |
        echo "COVERALLS_TOKEN=$(echo eUVUVGRHOFJhQm9GMFJBYTNibjVhcWFEblpac1lmMlE3Cg== | base64 -d)" >> $GITHUB_ENV

    - uses: actions/checkout@v7

    - name: Set up PostgreSQL
      uses: ikalnytskyi/action-setup-postgres@v7
      with:
        username: postgres
        password: postgres
        database: test_db
        port: 5432

    - name: Set up MySQL
      if: runner.os != 'Windows' || runner.arch != 'ARM64'
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: '8.0'
        root-password: root

      # actions-setup-mysql has no Windows arm64 build ("unable to get latest version"),
      # so install the official x64 MySQL 8.0 zip, which runs under Windows 11 x64 emulation.
    - name: Set up MySQL (Windows arm64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        $ver = '8.0.43'
        $base = "$env:RUNNER_TEMP\mysql-$ver-winx64"
        $data = "$env:RUNNER_TEMP\mysql-data"
        Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile "$env:RUNNER_TEMP\vc_redist.x64.exe"
        Start-Process "$env:RUNNER_TEMP\vc_redist.x64.exe" -ArgumentList '/install','/quiet','/norestart' -Wait
        Invoke-WebRequest "https://cdn.mysql.com/archives/mysql-8.0/mysql-$ver-winx64.zip" -OutFile "$env:RUNNER_TEMP\mysql.zip"
        Expand-Archive "$env:RUNNER_TEMP\mysql.zip" -DestinationPath $env:RUNNER_TEMP
        $ini = "$env:RUNNER_TEMP\my.ini"
        Set-Content $ini "[mysqld]`r`nbasedir=$($base -replace '\\','/')`r`ndatadir=$($data -replace '\\','/')`r`nport=3306`r`n"
        & "$base\bin\mysqld.exe" --defaults-file="$ini" --initialize-insecure --console
        if ($LASTEXITCODE -ne 0) { exit 1 }
        & "$base\bin\mysqld.exe" --install MySQL80 --defaults-file="$ini"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Start-Service MySQL80
        for ($i = 0; $i -lt 30; $i++) {
          & "$base\bin\mysqladmin.exe" -u root -h 127.0.0.1 -P 3306 --skip-password ping 2>$null
          if ($LASTEXITCODE -eq 0) { break }
          Start-Sleep -Seconds 2
        }
        & "$base\bin\mysql.exe" -u root -h 127.0.0.1 -P 3306 --skip-password -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'; CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'root'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Add-Content $env:GITHUB_PATH "$base\bin"

      # setup-java finds no Temurin 25 build for Windows arm64, so use Zulu there
      # (Azul publishes native Windows aarch64 JDKs); every other leg stays on Temurin.
    - name: Set up Java ${{ matrix.java }}
      uses: actions/setup-java@v5.7.0
      with:
        distribution: ${{ (runner.os == 'Windows' && runner.arch == 'ARM64') && 
          'zulu' || 'temurin' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'

    - name: Check Java linting
      id: java_linting
      run: |
        mvn -T 4 -B compile test-compile formatter:validate impsort:check javadoc:javadoc -Ddoclint=html,syntax,accessibility,reference

    - name: Configure connections to databases
      id: configure_db_connections
      run: cat extensions/database/tests/conf/github_actions_tests.xml | sed -e 
        "s/MYSQL_PORT/3306/g" | sed -e "s/POSTGRES_PORT/5432/g" > 
        extensions/database/tests/conf/tests.xml

    - name: Populate databases with test data
      id: populate_databases_with_test_data
      run: |
        mysql -u root -h 127.0.0.1 -P 3306 -proot -e 'CREATE DATABASE test_db;'
        mysql -u root -h 127.0.0.1 -P 3306 -proot < extensions/database/tests/conf/test-mysql.sql
        psql -U postgres test_db -h 127.0.0.1 -p 5432 < extensions/database/tests/conf/test-pgsql.sql
      env:
        PGPASSWORD: postgres

    - name: Build and test with Maven
      run: mvn -T 4 -B jacoco:prepare-agent test jacoco:report

    - name: Coveralls server
      uses: coverallsapp/github-action@v2
      with:
        base-path: server/src
        files: server/target/site/jacoco/jacoco.xml
        format: jacoco
        flag-name: Java-${{ matrix.java }}-server
        fail-on-error: false
        parallel: true

    - name: Coveralls main
      uses: coverallsapp/github-action@v2
      with:
        base-path: main/src
        files: main/target/site/jacoco/jacoco.xml
        format: jacoco
        flag-name: Java-${{ matrix.java }}-main
        fail-on-error: false
        parallel: true

    - name: Coveralls core
      uses: coverallsapp/github-action@v2
      with:
        base-path: modules/core/src/main/java
        files: modules/core/target/site/jacoco/jacoco.xml
        format: jacoco
        flag-name: Java-${{ matrix.java }}-core
        fail-on-error: false
        parallel: true

    - name: Coveralls grel
      uses: coverallsapp/github-action@v2
      with:
        base-path: modules/grel/src/main/java
        files: modules/grel/target/site/jacoco/jacoco.xml
        format: jacoco
        flag-name: Java-${{ matrix.java }}-grel
        fail-on-error: false
        parallel: true

    - name: Coveralls database
      uses: coverallsapp/github-action@v2
      with:
        base-path: extensions/database/src
        files: extensions/database/target/site/jacoco/jacoco.xml
        github-token: ${{ env.COVERALLS_TOKEN }}
        format: jacoco
        flag-name: Java-${{ matrix.java }}-database
        fail-on-error: false
        parallel: true

    - name: Coveralls wikibase
      uses: coverallsapp/github-action@v2
      with:
        base-path: extensions/wikibase/src
        files: extensions/wikibase/target/site/jacoco/jacoco.xml
        github-token: ${{ env.COVERALLS_TOKEN }}
        format: jacoco
        flag-name: Java-${{ matrix.java }}-wikibase
        fail-on-error: false
        parallel: true

    - name: Coveralls jython
      uses: coverallsapp/github-action@v2
      with:
        base-path: extensions/jython/src
        files: extensions/jython/target/site/jacoco/jacoco.xml
        github-token: ${{ env.COVERALLS_TOKEN }}
        format: jacoco
        flag-name: Java-${{ matrix.java }}-jython
        fail-on-error: false
        parallel: true

    name: linux_server_tests [${{ matrix.expander_leg }}]
    timeout-minutes: 150
